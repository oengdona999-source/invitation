<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>បញ្ជីចុះឈ្មោះ — Admin</title><link href="https://fonts.googleapis.com/css2?family=Moul&family=Siemreap&display=swap" rel="stylesheet"><link rel="stylesheet" href="register.css?v=1"><script defer src="admin.js?v=1"></script></head><body><main class="admin-shell"><header class="admin-header"><div><h1>បញ្ជីបញ្ជាក់ការចូលរួម</h1><p>ថ្ងៃទី ១៨ ខែវិច្ឆិកា ឆ្នាំ២០២៦</p></div><button id="logout" hidden type="button">ចាកចេញ</button></header><form id="login" class="card login"><label for="key">លេខសម្ងាត់ Admin</label><input id="key" type="password" autocomplete="current-password" required><p>ប្រើលេខសម្ងាត់ Admin លីងអញ្ជើញចាស់។</p><button type="submit">ចូលមើលបញ្ជី</button><p id="login-status" role="status"></p></form><section id="dashboard" class="card admin-card" hidden><div class="stats"><div class="stat">ការឆ្លើយតបសរុប<b id="total">0</b></div><div class="stat">ចូលរួម<b id="yes-count">0</b></div><div class="stat">មិនអាចចូលរួម<b id="no-count">0</b></div></div><div class="toolbar"><label>ស្វែងរកឈ្មោះ / លេខទូរសព្ទ<input id="search" type="search"></label><label>ការឆ្លើយតប<select id="filter"><option value="all">ទាំងអស់</option><option value="yes">ចូលរួម</option><option value="no">មិនអាចចូលរួម</option></select></label><button id="refresh" type="button">ផ្ទុកឡើងវិញ</button><button id="download" type="button">ទាញយក Excel (CSV)</button><a href="./" target="_blank" rel="noopener">ទំព័រចុះឈ្មោះ</a></div><p id="admin-status" role="status"></p><p id="showing"></p><div class="table-wrap"><table><thead><tr><th>ល.រ.</th><th>ឈ្មោះ</th><th>លេខទូរសព្ទ</th><th>ការឆ្លើយតប</th><th>កែចុងក្រោយ</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></body></html>
