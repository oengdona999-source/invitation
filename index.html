      <h2 class="section-title" id="gallery-title">វិចិត្រសាល <small>PHOTO GALLERY</small></h2>
      <div class="gallery"><img class="photo" src="downloaded-e-sambot-site/cmssambot.b-cdn.net/05/2026/image/segments/Dgaw9QK8F8rmsuPGEyBuydSe9ukFkiliTnShkGHL.jpg" alt="Gallery 1" loading="lazy"><img class="photo" src="downloaded-e-sambot-site/cmssambot.b-cdn.net/05/2026/image/segments/EOiiEz3xbNtxXlFE6FVbwsF1lt2qgk8dvz0gVVdt.jpg" alt="Gallery 2" loading="lazy"><img class="photo" src="downloaded-e-sambot-site/cmssambot.b-cdn.net/05/2026/image/segments/wK1370N9tcdFYw171byjyj0C6DUBB1MY1Hvia92m.jpg" alt="Gallery 3" loading="lazy"></div>
    </section>
    <section id="video" aria-label="វីដេអូ">
      <div class="youtube-frame">
        <iframe src="https://www.youtube-nocookie.com/embed/-4ScxFmTTTA?rel=0&amp;modestbranding=1&amp;playsinline=1&amp;autoplay=0&amp;mute=0" title="វីដេអូកម្មវិធី" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
    </section>
    <section id="thank-you" aria-label="Thank you">
      <img class="section-art" src="downloaded-e-sambot-site/cmssambot.b-cdn.net/05/2026/image/segments/E6OeFkiDkP204MhAhYBRFk9PQm9cgXBnJSNxDkCg.png" alt="Thank You">
    </section>
    <section id="greetings" aria-labelledby="greeting-title">
      <h2 class="section-title" id="greeting-title">សារជូនពរ <small>GREETING MESSAGE</small></h2>
      <div class="card">
        <form id="greeting-form">
          <label>ឈ្មោះភ្ញៀវកិត្តិយស<input name="name" value="ភ្ញៀវកិត្តិយស" required maxlength="200"></label>
          <label>សារជូនពរ<textarea name="message" placeholder="សរសេរសារជូនពររបស់អ្នក..." required maxlength="2000" rows="4"></textarea></label>
          <button class="send-button" type="submit" aria-label="ផ្ញើសារជូនពរ"><img src="downloaded-e-sambot-site/e.sambot.co/send-greeting-button.png" alt="ផ្ញើសារជូនពរ"></button>
        </form>
        <div class="messages" id="messages" aria-live="polite">
        </div>
      </div>
    </section>
  </main>
  <nav class="floating-anchor-icons" aria-label="Invitation sections">
    <a class="floating-anchor-icon" href="#information" aria-label="Scroll to Information"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h8l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M14 3.5V8h4M8 12h8M8 16h8"/></svg></a>
    <a class="floating-anchor-icon" href="#location" aria-label="Scroll to Map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></a>
    <a class="floating-anchor-icon" href="#gallery" aria-label="Scroll to Gallery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/></svg></a>
    <a class="floating-anchor-icon" href="#greetings" aria-label="Scroll to Messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg></a>
  </nav>
  
  <script>
    function updateViewportHeight() {
      document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    }
    updateViewportHeight();
    window.addEventListener('resize', updateViewportHeight, { passive: true });
    document.body.classList.add('has-motion');
    let transitionStarted = false;
    function openInvitation(event) {
      event.preventDefault();
      if (transitionStarted) return;
      transitionStarted = true;
      const cover = document.querySelector('#cover');
      cover.classList.remove('is-opening');
      void cover.offsetWidth;
      cover.classList.add('is-opening');
      const transitionVideo = document.querySelector('#transition-video');
      transitionVideo.pause();
      transitionVideo.currentTime = 0;
      cover.classList.add('playing-transition');
      transitionVideo.play().catch(() => {
        transitionVideo.controls = true;
      });
      document.querySelector('#background-music').play().catch(() => {});
    }

    const music = document.querySelector('#background-music');
    const muteButton = document.querySelector('#mute-button');
    muteButton.addEventListener('click', () => {
      music.muted = !music.muted;
      const muted = music.muted;
      muteButton.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
      muteButton.title = muted ? 'Unmute sound' : 'Mute sound';
      muteButton.innerHTML = muted
        ? '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m16 9 5 6m0-6-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 9a4 4 0 0 1 0 6m2-9a8 8 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
      if (!muted && music.paused) music.play().catch(() => {});
    });

    const transitionVideo = document.querySelector('#transition-video');
    let transitionFinished = false;
    function finishVideoTransition() {
      const cover = document.querySelector('#cover');
      if (transitionFinished || !cover.classList.contains('playing-transition')) return;
      transitionFinished = true;
      transitionVideo.pause();
      cover.classList.remove('playing-transition', 'is-fading-out');
      cover.classList.add('is-complete');
      document.body.classList.add('transition-pending');
      const pageVideo = document.querySelector('#page-video');
      const pageVideoWrap = document.querySelector('#page-video-wrap');
      let revealed = false;
      const revealPage = () => {
        if (revealed) return;
        revealed = true;
        pageVideoWrap.classList.add('is-active');
        document.body.classList.add('page-opened');
        document.body.classList.remove('invitation-locked', 'transition-pending');
        document.body.classList.add('page-entering');
        if (window.location.hash) {
          try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (_) {}
        }
        const root = document.documentElement;
        const previousScrollBehavior = root.style.scrollBehavior;
        root.style.scrollBehavior = 'auto';
        window.scrollTo(0, 0);
        requestAnimationFrame(() => { root.style.scrollBehavior = previousScrollBehavior; });
        window.setTimeout(() => document.body.classList.remove('page-entering'), 850);
      };
      pageVideo.currentTime = 0.7;
      pageVideo.addEventListener('playing', revealPage, { once: true });
      pageVideo.addEventListener('error', revealPage, { once: true });
      pageVideo.play().catch(revealPage);
    }
    transitionVideo.addEventListener('timeupdate', () => {
      if (Number.isFinite(transitionVideo.duration) && transitionVideo.duration > 1 &&
          transitionVideo.currentTime >= transitionVideo.duration - 1) {
        finishVideoTransition();
      }
    });
    transitionVideo.addEventListener('ended', finishVideoTransition);
    transitionVideo.addEventListener('error', finishVideoTransition);

    const sections = document.querySelectorAll('main section');
    if ('IntersectionObserver' in window) {
      const sectionObserver = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.remove('is-visible');
            void entry.target.offsetWidth;
            entry.target.classList.add('is-visible');
          } else {
            entry.target.classList.remove('is-visible');
          }
        });
      }, { rootMargin: '0px 0px -60px 0px', threshold: 0.05 });
      sections.forEach(section => sectionObserver.observe(section));
    } else {
      sections.forEach(section => section.classList.add('is-visible'));
    }

    // This standalone sample keeps newly submitted greetings in this browser only.
    const form = document.querySelector('#greeting-form');
    const messages = document.querySelector('#messages');
    form.addEventListener('submit', event => {
      event.preventDefault();
      const data = new FormData(form);
      const card = document.createElement('article');
      card.className = 'message';
      const body = document.createElement('div');
      body.textContent = `${data.get('name')}: ${data.get('message')}`;
      const time = document.createElement('time');
      time.textContent = new Date().toLocaleString();
      card.append(body, time);
      messages.prepend(card);
      form.reset();
    });
  </script>
</body>
</html>
